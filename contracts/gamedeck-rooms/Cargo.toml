[package]
name = "gamedeck-rooms-contract"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }

[features]
default = ["freenet-main-contract", "contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]
