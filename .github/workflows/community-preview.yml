name: Publish community preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build preview · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: npm run dist:win
          - name: macos-universal
            os: macos-latest
            command: npm run dist:mac
          - name: linux-x64
            os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools fakeroot
      - run: npm ci
      - run: npm test
      - name: Build preview packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs "preview-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: community-preview-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build preview - android apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build full GameDeck Android APK
        working-directory: mobile/android
        run: >-
          gradle --no-daemon clean lintDebug assembleDebug
          -PgamedeckApplicationId=io.gamedeck.mobile.preview
          -PgamedeckAppLabel="GameDeck Preview"
          -PgamedeckVersionName=1.3.0-preview
          -PgamedeckVersionCode=10320
          -PgamedeckControllerOnly=false
          -PgamedeckControllerEnabled=false
      - name: Save full GameDeck APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/android/GameDeck-Android-community-preview.apk
      - name: Build controller-only Android APK
        working-directory: mobile/android
        run: >-
          gradle --no-daemon clean lintDebug assembleDebug
          -PgamedeckApplicationId=io.gamedeck.controller.preview
          -PgamedeckAppLabel="GameDeck Controller"
          -PgamedeckVersionName=1.3.0-controller-preview
          -PgamedeckVersionCode=10321
          -PgamedeckControllerOnly=true
          -PgamedeckControllerEnabled=true
      - name: Save controller APK
        shell: bash
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/android/GameDeck-Controller-Android-community-preview.apk
      - name: Inspect Android packages
        shell: bash
        run: |
          set -euo pipefail
          FULL="dist/android/GameDeck-Android-community-preview.apk"
          CONTROLLER="dist/android/GameDeck-Controller-Android-community-preview.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$FULL" | tee dist/android/APK-GAMEDECK-METADATA.txt
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$CONTROLLER" | tee dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "package: name='io.gamedeck.mobile.preview'" dist/android/APK-GAMEDECK-METADATA.txt
          grep -F "package: name='io.gamedeck.controller.preview'" dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "sdkVersion:'26'" dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "targetSdkVersion:'36'" dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "uses-permission: name='android.permission.VIBRATE'" dist/android/APK-CONTROLLER-METADATA.txt
          grep -F "uses-permission: name='android.permission.BLUETOOTH_CONNECT'" dist/android/APK-CONTROLLER-METADATA.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$FULL" | tee dist/android/APK-GAMEDECK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$CONTROLLER" | tee dist/android/APK-CONTROLLER-SIGNATURE.txt
          sha256sum "$FULL" "$CONTROLLER" > dist/android/SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: community-preview-android-${{ github.sha }}
          path: dist/android/*
          retention-days: 30

  publish:
    name: Publish coordinated preview
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: preview-artifacts
          merge-multiple: true
      - name: Point preview tag at this build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f community-preview "$GITHUB_SHA"
          git push --force origin community-preview
      - name: Publish coordinated preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view community-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload community-preview preview-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit community-preview --prerelease --title "GameDeck Community Preview 1.3.0" --notes "Matching Windows, Linux, macOS, and two separate Android apps: full GameDeck and the controller-only GameDeck Controller. Every full GameDeck participates in the Freenet-backed community; controller apps pair to a GameDeck and do not run games or their own Freenet node. The Controller supports Wi-Fi WebRTC video/audio and low-latency input, optional Android Bluetooth HID, analog sticks, motion, haptics, Open Rooms, and community chat through the paired GameDeck." --repo "$GITHUB_REPOSITORY"
          else
            gh release create community-preview preview-artifacts/* --prerelease --verify-tag --title "GameDeck Community Preview 1.3.0" --notes "Matching Windows, Linux, macOS, and two separate Android apps: full GameDeck and the controller-only GameDeck Controller. Every full GameDeck participates in the Freenet-backed community; controller apps pair to a GameDeck and do not run games or their own Freenet node. The Controller supports Wi-Fi WebRTC video/audio and low-latency input, optional Android Bluetooth HID, analog sticks, motion, haptics, Open Rooms, and community chat through the paired GameDeck." --repo "$GITHUB_REPOSITORY"
          fi
