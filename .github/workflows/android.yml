name: Android

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and launch debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and emulator image
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect and checksum APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS-android-debug.txt
          unzip -l "$APK" > app/build/outputs/apk/debug/APK-CONTENTS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > app/build/outputs/apk/debug/APK-BADGING.txt

      - name: Launch clean API 36 emulator smoke test
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug
          BADGING="$OUT/APK-BADGING.txt"
          PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$BADGING" | head -1)
          ACTIVITY=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" "$BADGING" | head -1)
          test -n "$PACKAGE"
          test -n "$ACTIVITY"
          AVD=gamedeck_api36
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -f "$APK"
          test -x "$EMULATOR"
          echo no | avdmanager create avd \
            --force \
            --name "$AVD" \
            --path "$ANDROID_AVD_HOME/$AVD.avd" \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          "$EMULATOR" -list-avds | tee "$OUT/AVD-LIST.txt"
          grep -qx "$AVD" "$OUT/AVD-LIST.txt"
          ACCEL=off
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL=on
          fi
          "$EMULATOR" \
            -avd "$AVD" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -accel "$ACCEL" \
            -gpu swiftshader_indirect \
            > "$OUT/EMULATOR-LOG.txt" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          if ! timeout 180 adb wait-for-device; then
            cat "$OUT/EMULATOR-LOG.txt"
            exit 1
          fi
          booted=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat "$OUT/EMULATOR-LOG.txt"
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            cat "$OUT/EMULATOR-LOG.txt"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install "$APK"
          adb logcat -c
          adb shell am start -W -n "$PACKAGE/$ACTIVITY" --ez gamedeck.qa.fixture true \
            | tee "$OUT/ACTIVITY-START.txt"

          renderer_ready=0
          for attempt in $(seq 1 50); do
            adb logcat -d -v brief \
              | grep -E "GAMEDECK_RENDERER_(READY|ERROR)" \
              | tail -1 \
              > "$OUT/RENDERER-STATUS.txt" || true
            if grep -q "GAMEDECK_RENDERER_ERROR" "$OUT/RENDERER-STATUS.txt"; then
              break
            fi
            if grep -q "GAMEDECK_RENDERER_READY" "$OUT/RENDERER-STATUS.txt"; then
              renderer_ready=1
              break
            fi
            sleep 1
          done

          adb shell dumpsys window \
            | grep -E "mCurrentFocus|mFocusedApp" \
            | tee "$OUT/WINDOW-FOCUS.txt"
          grep -Fq "$PACKAGE" "$OUT/WINDOW-FOCUS.txt"
          adb exec-out screencap -p > "$OUT/EMULATOR-SCREENSHOT.png"
          test -s "$OUT/EMULATOR-SCREENSHOT.png"

          SCREENSHOT="$OUT/EMULATOR-SCREENSHOT.png" python3 - <<'PY'
          import os, struct, zlib

          path = os.environ['SCREENSHOT']
          data = open(path, 'rb').read()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('screenshot is not PNG')

          position = 8
          width = height = color_type = bit_depth = None
          compressed = bytearray()
          while position < len(data):
              length = struct.unpack('>I', data[position:position + 4])[0]
              kind = data[position + 4:position + 8]
              payload = data[position + 8:position + 8 + length]
              position += 12 + length
              if kind == b'IHDR':
                  width, height, bit_depth, color_type, _, _, _ = struct.unpack('>IIBBBBB', payload)
              elif kind == b'IDAT':
                  compressed.extend(payload)
              elif kind == b'IEND':
                  break

          if bit_depth != 8 or color_type not in (2, 6):
              raise SystemExit(f'unsupported screenshot PNG mode depth={bit_depth} color={color_type}')
          channels = 3 if color_type == 2 else 4
          stride = width * channels
          raw = zlib.decompress(bytes(compressed))
          rows = []
          offset = 0
          previous = bytearray(stride)
          for _ in range(height):
              filter_type = raw[offset]
              offset += 1
              current = bytearray(raw[offset:offset + stride])
              offset += stride
              for index in range(stride):
                  left = current[index - channels] if index >= channels else 0
                  up = previous[index]
                  upper_left = previous[index - channels] if index >= channels else 0
                  if filter_type == 1:
                      current[index] = (current[index] + left) & 255
                  elif filter_type == 2:
                      current[index] = (current[index] + up) & 255
                  elif filter_type == 3:
                      current[index] = (current[index] + ((left + up) // 2)) & 255
                  elif filter_type == 4:
                      prediction = left + up - upper_left
                      pa, pb, pc = abs(prediction - left), abs(prediction - up), abs(prediction - upper_left)
                      predictor = left if pa <= pb and pa <= pc else up if pb <= pc else upper_left
                      current[index] = (current[index] + predictor) & 255
                  elif filter_type != 0:
                      raise SystemExit(f'unsupported PNG filter {filter_type}')
              rows.append(current)
              previous = current

          top = max(0, int(height * 0.04))
          bottom = min(height, int(height * 0.96))
          sample_step = max(1, min(width, height) // 360)
          colors = set()
          non_background = 0
          background = (9, 11, 16)
          for y in range(top, bottom, sample_step):
              row = rows[y]
              for x in range(0, width, sample_step):
                  start = x * channels
                  rgb = tuple(row[start:start + 3])
                  colors.add(rgb)
                  if sum(abs(rgb[i] - background[i]) for i in range(3)) > 18:
                      non_background += 1

          report = f'width={width} height={height} sampled_colors={len(colors)} non_background_samples={non_background}'
          open(os.path.join(os.path.dirname(path), 'SCREENSHOT-ANALYSIS.txt'), 'w').write(report + '\n')
          print(report)
          if len(colors) < 80 or non_background < 900:
              raise SystemExit('renderer screenshot is blank or effectively monochrome')
          PY

          if adb shell uiautomator dump /sdcard/gamedeck-window.xml; then
            adb pull /sdcard/gamedeck-window.xml "$OUT/UI-HIERARCHY.xml" || true
          fi
          adb logcat -d -v brief > "$OUT/LOGCAT.txt"
          PACKAGE_REGEX=${PACKAGE//./\\.}
          ! grep -Eqi "FATAL EXCEPTION.*$PACKAGE_REGEX|Process: $PACKAGE_REGEX.*FATAL EXCEPTION" "$OUT/LOGCAT.txt"
          if [ "$renderer_ready" != "1" ]; then
            cat "$OUT/RENDERER-STATUS.txt"
            grep -E "GameDeckRenderer|chromium|cr_AwContents" "$OUT/LOGCAT.txt" | tail -160 || true
            exit 1
          fi
          grep -q '"renderer":"shared-desktop"' "$OUT/RENDERER-STATUS.txt"
          grep -q '"startupObserved":true' "$OUT/RENDERER-STATUS.txt"
          grep -q '"viewportVerified":true' "$OUT/RENDERER-STATUS.txt"
          grep -q '"fixtureVerified":true' "$OUT/RENDERER-STATUS.txt"
          grep -q '"gameCards":1' "$OUT/RENDERER-STATUS.txt"
          grep -q '"firstGameTitle":"Chrono Trigger"' "$OUT/RENDERER-STATUS.txt"
          grep -q '"artworkKind":"data"' "$OUT/RENDERER-STATUS.txt"
          grep -q '"descriptionVerified":true' "$OUT/RENDERER-STATUS.txt"
          grep -q '"factsVerified":true' "$OUT/RENDERER-STATUS.txt"

      - name: Upload Android debug and smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamedeck-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS-android-debug.txt
            mobile/android/app/build/outputs/apk/debug/APK-CONTENTS.txt
            mobile/android/app/build/outputs/apk/debug/APK-BADGING.txt
            mobile/android/app/build/outputs/apk/debug/AVD-LIST.txt
            mobile/android/app/build/outputs/apk/debug/ACTIVITY-START.txt
            mobile/android/app/build/outputs/apk/debug/WINDOW-FOCUS.txt
            mobile/android/app/build/outputs/apk/debug/RENDERER-STATUS.txt
            mobile/android/app/build/outputs/apk/debug/SCREENSHOT-ANALYSIS.txt
            mobile/android/app/build/outputs/apk/debug/UI-HIERARCHY.xml
            mobile/android/app/build/outputs/apk/debug/EMULATOR-SCREENSHOT.png
            mobile/android/app/build/outputs/apk/debug/EMULATOR-LOG.txt
            mobile/android/app/build/outputs/apk/debug/LOGCAT.txt
          if-no-files-found: warn
          retention-days: 14
