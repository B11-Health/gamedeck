name: Publish Android preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build and inspect APK
        working-directory: mobile/android
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Prepare preview release
        run: |
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/android/GameDeck-Android-preview.apk
          sha256sum dist/android/GameDeck-Android-preview.apk > dist/android/SHA256SUMS-android.txt
      - name: Publish preview asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-preview dist/android/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-preview dist/android/* --prerelease --title "GameDeck Android Preview" --notes "Installable Android preview for controller, touch, haptics, Open Rooms, and community chat testing." --repo "$GITHUB_REPOSITORY"
          fi
