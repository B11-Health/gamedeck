name: Publish Android preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build and inspect APK
        working-directory: mobile/android
        run: >-
          gradle --no-daemon lintDebug assembleDebug
          -PgamedeckApplicationId=io.gamedeck.mobile.preview
          -PgamedeckAppLabel="GameDeck Preview"
          -PgamedeckVersionName=1.3.0-controller-preview
          -PgamedeckVersionCode=10310
      - name: Inspect preview release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          APK="dist/android/GameDeck-Android-preview.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | tee dist/android/APK-METADATA.txt
          grep -F "package: name='io.gamedeck.mobile.preview'" dist/android/APK-METADATA.txt
          grep -F "sdkVersion:'26'" dist/android/APK-METADATA.txt
          grep -F "targetSdkVersion:'36'" dist/android/APK-METADATA.txt
          grep -F "uses-permission: name='android.permission.INTERNET'" dist/android/APK-METADATA.txt
          grep -F "uses-permission: name='android.permission.VIBRATE'" dist/android/APK-METADATA.txt
          grep -F "uses-permission: name='android.permission.BLUETOOTH_CONNECT'" dist/android/APK-METADATA.txt
          grep -F "uses-permission: name='android.permission.BLUETOOTH_ADVERTISE'" dist/android/APK-METADATA.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/android/APK-SIGNATURE.txt
          sha256sum "$APK" > dist/android/SHA256SUMS-android.txt
      - name: Publish preview asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-preview dist/android/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-preview dist/android/* --prerelease --title "GameDeck Android Preview" --notes "Installable combined Android preview with standalone GameDeck plus GameDeck Controller, Wi-Fi streaming, optional Bluetooth HID, touch, motion, haptics, Open Rooms, and community chat testing." --repo "$GITHUB_REPOSITORY"
          fi
