name: Cross-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: npm run dist:win
          - name: macos-universal
            os: macos-latest
            command: npm run dist:mac
          - name: linux-x64
            os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools fakeroot
      - run: npm ci
      - run: npm test
      - name: Build packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs "${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: gamedeck-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30


  android:
    name: Build · android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build installable preview APK
        working-directory: mobile/android
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Name Android artifact
        run: |
          mkdir -p dist/android
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/android/GameDeck-Android-${GITHUB_REF_NAME:-preview}.apk
          sha256sum dist/android/GameDeck-Android-*.apk > dist/android/SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: gamedeck-android-${{ github.sha }}
          path: dist/android/*
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "GameDeck $TAG"
