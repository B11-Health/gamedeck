name: Android visual QA

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    name: Exercise phone UI and capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator image
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Launch, interact, and capture
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=app/build/outputs/apk/debug/visual-qa
          mkdir -p "$OUT"
          BADGING="$OUT/APK-BADGING.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > "$BADGING"
          PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$BADGING" | head -1)
          ACTIVITY=$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" "$BADGING" | head -1)
          test -n "$PACKAGE"
          test -n "$ACTIVITY"

          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-visual-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name gamedeck_visual_api36 \
            --path "$ANDROID_AVD_HOME/gamedeck_visual_api36.avd" \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6

          ACCEL=off
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL=on
          fi
          "$ANDROID_HOME/emulator/emulator" \
            -avd gamedeck_visual_api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -accel "$ACCEL" \
            -gpu swiftshader_indirect \
            > "$OUT/EMULATOR-LOG.txt" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install "$APK"
          adb shell "run-as $PACKAGE sh -c 'mkdir -p files && touch files/renderer-fixture.enabled'"
          adb logcat -c
          adb shell am start -W -n "$PACKAGE/$ACTIVITY" | tee "$OUT/ACTIVITY-START.txt"

          ready=0
          for attempt in $(seq 1 55); do
            adb logcat -d -v brief | grep -E "GAMEDECK_RENDERER_(READY|ERROR)" | tail -1 > "$OUT/RENDERER-STATUS.txt" || true
            if grep -q "GAMEDECK_RENDERER_ERROR" "$OUT/RENDERER-STATUS.txt"; then
              break
            fi
            if grep -q "GAMEDECK_RENDERER_READY" "$OUT/RENDERER-STATUS.txt"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          sleep 3

          adb exec-out screencap -p > "$OUT/01-library-top.png"

          adb shell input swipe 540 2050 540 650 700
          sleep 2
          adb exec-out screencap -p > "$OUT/02-library-scrolled.png"

          adb shell input swipe 540 650 540 2050 700
          adb shell input swipe 540 650 540 2050 700
          sleep 2

          adb shell input tap 326 255
          sleep 3
          adb exec-out screencap -p > "$OUT/03-discover-top.png"
          adb shell input swipe 540 2050 540 650 700
          sleep 2
          adb exec-out screencap -p > "$OUT/04-discover-scrolled.png"

          adb shell input swipe 540 650 540 2050 700
          adb shell input swipe 540 650 540 2050 700
          sleep 2
          adb shell input tap 974 255
          sleep 3
          adb exec-out screencap -p > "$OUT/05-community-top.png"

          adb shell input tap 1024 132
          sleep 2
          adb exec-out screencap -p > "$OUT/06-overflow-menu.png"

          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > "$OUT/WINDOW-FOCUS.txt"
          grep -Fq "$PACKAGE" "$OUT/WINDOW-FOCUS.txt"
          adb logcat -d -v brief > "$OUT/LOGCAT.txt"
          PACKAGE_REGEX=${PACKAGE//./\\.}
          ! grep -Eqi "FATAL EXCEPTION.*$PACKAGE_REGEX|Process: $PACKAGE_REGEX.*FATAL EXCEPTION" "$OUT/LOGCAT.txt"

          for shot in "$OUT"/*.png; do
            test -s "$shot"
          done

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamedeck-android-visual-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/visual-qa
          if-no-files-found: warn
          retention-days: 14
