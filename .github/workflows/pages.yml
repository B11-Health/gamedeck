name: Deploy growth site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "mobile/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stage site and universal controller
        run: |
          rm -rf site-build
          mkdir -p site-build/controller
          cp -R site/. site-build/
          cp -R mobile/web/. site-build/controller/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-build
      - id: deployment
        uses: actions/deploy-pages@v4
