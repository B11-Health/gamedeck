plugins { id 'com.android.library' }

android {
    namespace 'io.gamedeck.ps2engine'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging false }
        resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    // This module vendors upstream Play!/SDL Android sources. Their lint debt is
    // reported in CI, but must not fail GameDeck's app build; GameDeck-owned
    // Android sources remain under the app module's normal fatal lint policy.
    lint {
        abortOnError false
    }
}
