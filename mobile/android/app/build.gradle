plugins { id 'com.android.application' }

def repositoryRoot = new File(rootProject.projectDir, '../..').canonicalFile
def sharedRendererAssets = file("$buildDir/generated/sharedRenderer")

tasks.register('prepareSharedRenderer') {
    inputs.dir(new File(repositoryRoot, 'src'))
    inputs.dir(new File(repositoryRoot, 'assets'))
    inputs.dir(new File(projectDir, 'src/main/assets'))
    outputs.dir(sharedRendererAssets)

    doLast {
        delete sharedRendererAssets
        copy {
            from new File(repositoryRoot, 'src')
            into new File(sharedRendererAssets, 'desktop')
        }
        copy {
            from new File(repositoryRoot, 'assets')
            into new File(sharedRendererAssets, 'assets')
        }

        File indexFile = new File(sharedRendererAssets, 'desktop/index.html')
        String index = indexFile.getText('UTF-8')
        index = index.replace(
            "img-src 'self' data: file:; connect-src 'self' http:;",
            "img-src 'self' data: file: content: blob: https:; connect-src 'self' http: https:;"
        )
        index = index.replace(
            '<link rel="stylesheet" href="styles.css">',
            '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="android-overrides.css">\n  <link rel="stylesheet" href="android-polish.css">\n  <link rel="stylesheet" href="android-shell-fixes.css">\n  <link rel="stylesheet" href="android-controller.css">'
        )
        index = index.replace(
            '<script src="app.js"></script>',
            '<script src="platform-android-native.js"></script>\n  <script src="debug-fixture.js"></script>\n  <script src="app.js"></script>\n  <script src="android-controller.js"></script>\n  <script src="renderer-probe.js"></script>\n  <script src="android-qa-probe.js"></script>'
        )
        if (!index.contains('platform-android-native.js') || !index.contains('android-controller.js')) {
            throw new GradleException('Android native platform or controller adapter was not inserted into index.html')
        }
        indexFile.write(index, 'UTF-8')

        File platformSource = new File(projectDir, 'src/main/assets/desktop/platform-android.js')
        if (!platformSource.isFile()) {
            throw new GradleException("Missing Android platform adapter source: ${platformSource}")
        }
        File platformFile = new File(sharedRendererAssets, 'desktop/platform-android-native.js')
        String platform = platformSource.getText('UTF-8')
        List<String> requiredNativeContracts = [
            "invoke('catalogSystems'",
            "invoke('catalogGames'",
            "invoke('downloads'",
            "invoke('importOwned'",
            "invoke('retryDownload'",
            "invoke('pauseDownload'",
            "invoke('dismissDownload'",
            'onDownload: subscribeDownloads',
            "version: '0.4.1-controls'"
        ]
        List<String> missingNativeContracts = requiredNativeContracts.findAll { !platform.contains(it) }
        if (platform.contains('android_discover_transfer_pending') || !missingNativeContracts.isEmpty()) {
            throw new GradleException(
                "Native Android RGSX adapter contract is incomplete: ${missingNativeContracts.join(', ')}"
            )
        }
        platformFile.write(platform, 'UTF-8')
    }
}

android {
    namespace 'io.gamedeck.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'io.gamedeck.mobile.desktoppreview'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.4.1-controls'
    }

    sourceSets {
        main {
            assets.srcDir(sharedRendererAssets)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareSharedRenderer')
}
