plugins { id 'com.android.application' }

def repositoryRoot = new File(rootProject.projectDir, '../..').canonicalFile
def sharedRendererAssets = file("$buildDir/generated/sharedRenderer")

tasks.register('prepareSharedRenderer') {
    inputs.dir(new File(repositoryRoot, 'src'))
    inputs.dir(new File(repositoryRoot, 'assets'))
    outputs.dir(sharedRendererAssets)

    doLast {
        delete sharedRendererAssets
        copy {
            from new File(repositoryRoot, 'src')
            into new File(sharedRendererAssets, 'desktop')
        }
        copy {
            from new File(repositoryRoot, 'assets')
            into new File(sharedRendererAssets, 'assets')
        }

        File indexFile = new File(sharedRendererAssets, 'desktop/index.html')
        String index = indexFile.getText('UTF-8')
        index = index.replace(
            "img-src 'self' data: file:; connect-src 'self' http:;",
            "img-src 'self' data: file: content: blob: https:; connect-src 'self' http: https:;"
        )
        index = index.replace(
            '<link rel="stylesheet" href="styles.css">',
            '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="android-overrides.css">\n  <link rel="stylesheet" href="android-polish.css">\n  <link rel="stylesheet" href="android-shell-fixes.css">'
        )
        index = index.replace(
            '<script src="app.js"></script>',
            '<script src="platform-android.js"></script>\n  <script src="debug-fixture.js"></script>\n  <script src="app.js"></script>\n  <script src="renderer-probe.js"></script>\n  <script src="android-qa-probe.js"></script>'
        )
        indexFile.write(index, 'UTF-8')

        File platformFile = new File(sharedRendererAssets, 'desktop/platform-android.js')
        String platform = platformFile.getText('UTF-8')
        String downloadBridge = '''  const downloadListeners = new Set();
  const downloadSnapshots = new Map();
  const pollNativeDownloads = () => {
    const rows = parse(invoke('downloads', '[]'), []);
    if (!Array.isArray(rows)) return [];
    rows.forEach(job => {
      const id = String(job?.taskId || job?.id || '');
      if (!id) return;
      const snapshot = JSON.stringify([
        job.status, job.stage, job.progress, job.downloadedSize, job.totalSize,
        job.message, job.installedFile, job.updatedAt
      ]);
      if (downloadSnapshots.get(id) === snapshot) return;
      downloadSnapshots.set(id, snapshot);
      if (job.status === 'complete') {
        libraryCache = null;
        catalogCache.clear();
      }
      downloadListeners.forEach(listener => {
        try { listener(job); } catch {}
      });
    });
    return rows;
  };
  const onNativeDownload = listener => {
    if (typeof listener !== 'function') return () => {};
    downloadListeners.add(listener);
    pollNativeDownloads();
    return () => downloadListeners.delete(listener);
  };
  setInterval(pollNativeDownloads, 350);

'''
        platform = platform.replace(
            '  window.deck = Object.freeze({',
            downloadBridge + '  window.deck = Object.freeze({' 
        )
        platform = platform.replace(
            '    catalogSystems,\n    catalogGames,',
            '''    catalogSystems: async () => parse(invoke('catalogSystems', '[]'), []),
    catalogGames: async source => parse(invoke('catalogGames', '[]', source || ''), []),'''
        )
        platform = platform.replace(
            "    importOwned: async () => blocked('Discover downloads are not enabled in this preview.', 'android_discover_transfer_pending'),",
            "    importOwned: async (source, folder, title, fileName) => parse(invoke('importOwned', '{}', source || '', folder || '', title || '', fileName || ''), { ok: false, message: 'Android transfer adapter unavailable.' }),"
        )
        platform = platform.replace(
            '    retryDownload: async () => ({ ok: false }),',
            "    retryDownload: async taskId => parse(invoke('retryDownload', '{}', taskId || ''), { ok: false }),"
        )
        platform = platform.replace(
            '    pauseDownload: async () => ({ ok: false }),',
            "    pauseDownload: async taskId => parse(invoke('pauseDownload', '{}', taskId || ''), { ok: false }),"
        )
        platform = platform.replace(
            '    dismissDownload: async () => ({ ok: true }),',
            "    dismissDownload: async taskId => parse(invoke('dismissDownload', '{\"ok\":true}', taskId || ''), { ok: true }),"
        )
        platform = platform.replace(
            '    onDownload: noopSubscription,',
            '    onDownload: onNativeDownload,'
        )
        platform = platform.replace(
            "version: '0.3.0-parity-preview'",
            "version: '0.4.0-rgsx-get'"
        )
        platformFile.write(platform, 'UTF-8')
    }
}

android {
    namespace 'io.gamedeck.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'io.gamedeck.mobile.desktoppreview'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.4.0-rgsx-get'
    }

    sourceSets {
        main {
            assets.srcDir(sharedRendererAssets)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareSharedRenderer')
}
