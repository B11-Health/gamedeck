plugins { id 'com.android.application' }

android {
    namespace 'io.gamedeck.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'io.gamedeck.mobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/controllerAssets"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}


tasks.register('syncControllerWeb', Copy) {
    from file('../../web')
    into file("$buildDir/generated/controllerAssets/controller")
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncControllerWeb')
}
